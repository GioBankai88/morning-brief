name: Daily Brief

on:
  schedule:
    - cron: "55 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "build.py"
      - "manifest.json"
      - ".github/workflows/daily.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests beautifulsoup4 yfinance
      - name: Build Daily Edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p dist
          python build.py
          cp manifest.json dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
