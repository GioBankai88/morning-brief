name: Daily Brief

on:
  schedule:
    # Runs at :05 every hour from 06:05 to 19:05 UTC
    # Covers 08:00–20:00 Milan time year-round (both winter CET & summer CEST)
    - cron: "5 6-19 * * *"
  workflow_dispatch:
  push:
    paths:
      - "build.py"
      - "manifest.json"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests beautifulsoup4
      - name: Build Daily Edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p dist
          python build.py
          cp manifest.json dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: pip install feedparser requests beautifulsoup4 yfinance

